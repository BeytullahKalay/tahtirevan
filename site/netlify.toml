# Tam sitenin Netlify ayarı. Netlify'da "Base directory" = site olmalı.
# Veri: Netlify Database (Postgres, NETLIFY_DB_URL kendiliğinden gelir) · Dosyalar: Netlify Blobs ("media" deposu).
# Netlify panelinde elle tanımlanacak ortam değişkeni: PAYLOAD_SECRET (uzun, rastgele; yereldekinin aynısı değil).
# Ayrıntı: .claude/skills/admin-panel/SKILL.md → "Netlify'da yayın".

[build]
  # 1) Veritabanı şemasını günceller (migrations/)
  # 2) `npm run netlify:veri` ile bekleyen veri varsa yazar (scripts/netlify-veri-yukle.mjs; canlı veritabanına yazma izni yalnızca derlemede var)
  # 3) Siteyi derler
  command = "npx payload migrate && node scripts/netlify-veri-yukle.mjs && npm run build"
  publish = ".next"

# Blobs erişimini derleme komutuna aktarır (veri-yukle betiği için)
[[plugins]]
  package = "./netlify/plugins/veri-yukle"

[build.environment]
  NODE_VERSION = "22"
